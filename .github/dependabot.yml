version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 10
    # These packages pin each other exactly, so they must be updated together.
    groups:
      httpx2:
        patterns: ["httpx2", "httpcore2"]
      zensical:
        patterns: ["zensical", "zensical-ui"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
