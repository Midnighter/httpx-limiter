name: Pyodide Test

on:
  workflow_call:
    inputs:
      build-artifact-name:
        required: true
        type: string
      build-artifact-path:
        required: true
        type: string
      pyodide-version:
        required: false
        type: string
        default: "314.0.7"
      os:
        required: false
        type: string
        default: "ubuntu-latest"
      runner:
        required: false
        type: string
        default: "selenium"
      browser:
        required: false
        type: string
        default: "chrome"
      browser-version:
        required: false
        type: string
        default: "latest"
      playwright-version:
        required: false
        type: string
        default: "" # latest
      pytest-extra-args:
        required: false
        type: string
        default: ""
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ inputs.os }}-${{ inputs.runner }}-${{ inputs.browser }}-${{ inputs.browser-version }}-${{ inputs.pyodide-version }}-${{ inputs.playwright-version }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ inputs.pyodide-version}},${{ inputs.browser }},${{ inputs.runner }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DISPLAY: :99
      FORCE_COLOR: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ contains(inputs.browser, 'node') || inputs.runner == 'playwright' }}
        with:
          node-version: "${{ inputs.browser-version }}"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ inputs.runner == 'playwright' }}
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-latest

      - name: Install playwright
        if: ${{ inputs.runner == 'playwright' }}
        env:
          PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
        run: |
          if [ -n "$PLAYWRIGHT_VERSION" ]
          then
            python -m pip install "playwright==$PLAYWRIGHT_VERSION"
          else
            python -m pip install playwright
          fi
          # TODO: install only browsers that are required
          python -m playwright install --with-deps

      - uses: pyodide/pyodide-actions/download-pyodide@012fa537869d343726d01863a34b773fc4d96a14 # v2
        with:
          version: "${{ inputs.pyodide-version }}"
          to: pyodide-dist

      - uses: pyodide/pyodide-actions/install-browser@012fa537869d343726d01863a34b773fc4d96a14 # v2
        with:
          runner: "${{ inputs.runner }}"
          browser: "${{ inputs.browser }}"
          browser-version: "${{ inputs.browser-version }}"
          playwright-version: "${{ inputs.playwright-version }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts from calling package
        if: ${{ inputs.build-artifact-name != 'none' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "${{ inputs.build-artifact-name }}"
          path: "${{ inputs.build-artifact-path }}"
          merge-multiple: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # pyodide-py 314 requires Python 3.14

      - name: install pyodide-py
        env:
          PYODIDE_VERSION: ${{ inputs.pyodide-version }}
        run: |
          python -m pip install "pyodide-py==$PYODIDE_VERSION"

      - name: Install pytest-pyodide
        run: |
          python -m pip install "pytest-pyodide>=0.59"

      - name: Run tests
        env:
          RUNNER: ${{ inputs.runner }}
          BROWSER: ${{ inputs.browser }}
          PYTEST_EXTRA_ARGS: ${{ inputs.pytest-extra-args }}
        run: |
          # The extra arguments are deliberately unquoted so that they split into words.
          python -m pytest -vra \
            --dist-dir=./pyodide-dist/ \
            --runner="$RUNNER" \
            --rt="$BROWSER" \
            $PYTEST_EXTRA_ARGS \
            tests/pyodide
