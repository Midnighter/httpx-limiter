name: Cron Test

on:
  schedule:
    # Run every Tuesday at 10:30.
    - cron: "30 10 * * 2"

permissions:
  contents: read

jobs:
  prerequisites:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pyodide:
    uses: ./.github/workflows/pyodide.yml
    permissions:
      contents: read
      actions: read

  documentation:
    needs: [prerequisites, pyodide]
    # Run only on push to the main branch.
    if: github.ref_name == 'main'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/docs.yml
    with:
      version: latest
