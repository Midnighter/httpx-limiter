name: Deploy Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          The version string set for the documentation.
        required: true
        type: string
      alias:
        description: >
          An alias for the chosen version, such as 'stable'.
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      alias:
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Ensure that only one documentation deployment to the gh-pages branch runs at a time.
concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  documentation:
    strategy:
      matrix:
        os: [ubuntu-slim]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      # Write permissions are needed to write to gh-pages branch.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch gh-pages branch
        run: git fetch --depth=1 origin gh-pages

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
        with:
          version: 1.17.1

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build documentation with alias
        if: inputs.alias != ''
        run: hatch run docs:deploy -- --update-aliases --push "${{ inputs.version }}" "${{ inputs.alias }}"

      - name: Build documentation without alias
        if: inputs.alias == ''
        run: hatch run docs:deploy -- --push "${{ inputs.version }}"

  otel-trace:
    # Only trace when this workflow is the entry point; when called via
    # `workflow_call` from another workflow, that workflow's own tracer
    # job covers these jobs already.
    if: always() && github.event_name == 'workflow_dispatch'
    name: Export trace to Honeycomb
    needs: [documentation]
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    steps:
      - name: Export workflow run to Honeycomb
        uses: dash0hq/otel-cicd-action@895874bfae14f840e3032f1a14c3f2b45c93f4af # v4.1.1
        with:
          otlpEndpoint: ${{ vars.HONEYCOMB_OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.HONEYCOMB_OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
