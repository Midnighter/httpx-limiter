name: Deploy Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          The version string set for the documentation.
        required: true
        type: string
      alias:
        description: >
          An alias for the chosen version, such as 'stable'.
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      alias:
        required: false
        type: string
        default: ""

permissions: {}

# Ensure that only one documentation deployment to the gh-pages branch runs at a time.
concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  documentation:
    strategy:
      matrix:
        os: [ubuntu-slim]
        python-version: ["3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      # Write permissions are needed to write to gh-pages branch.
      contents: write

    steps:
      # mike pushes to the gh-pages branch, which needs the persisted credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Fetch gh-pages branch
        run: git fetch --depth=1 origin gh-pages

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
        with:
          version: 1.18.2

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build documentation with alias
        if: inputs.alias != ''
        env:
          HATCH_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          VERSION: ${{ inputs.version }}
          ALIAS: ${{ inputs.alias }}
        run: hatch run docs:deploy -- --update-aliases --push "$VERSION" "$ALIAS"

      - name: Build documentation without alias
        if: inputs.alias == ''
        env:
          HATCH_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          VERSION: ${{ inputs.version }}
        run: hatch run docs:deploy -- --push "$VERSION"
