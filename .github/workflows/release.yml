name: CD

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+[a-z]+[0-9]+"

permissions:
  contents: read

jobs:
  prerequisites:
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pyodide:
    uses: $/.github/workflows/pyodide.yml
    permissions:
      contents: read
      actions: read

  release:
    needs: [prerequisites, pyodide]
    strategy:
      matrix:
        # Do not switch to ubuntu-slim: the PyPI publish action runs as a Docker
        # container action, which needs the Docker daemon that only the larger
        # runner image provides. ubuntu-slim is an unprivileged container without one.
        os: [ubuntu-latest]
        python-version: ["3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      # Write permissions are needed to create OIDC tokens.
      id-token: write
      # Write permissions are needed to make GitHub releases.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
        with:
          version: 1.17.1

      - name: Build package
        run: hatch build

      # We rely on a trusted publisher configuration being present on PyPI,
      # see https://docs.pypi.org/trusted-publishers/.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: GH release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # PEP 440 pre-releases (a, b, rc, dev) are flagged as such; final and post releases are not.
          case "$TAG" in
            *post*) flags=() ;;
            *[a-z]*) flags=(--prerelease) ;;
            *) flags=() ;;
          esac
          gh release create "$TAG" --verify-tag --title "$TAG" "${flags[@]}" \
            --notes "Please see https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md for the full release notes."

  documentation:
    needs: [release]
    permissions:
      contents: write
    uses: $/.github/workflows/docs.yml
    with:
      version: ${{ github.ref_name }}
      alias: stable
