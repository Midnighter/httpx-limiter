name: CD

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+[a-z]+[0-9]+"

permissions: {}

jobs:
  prerequisites:
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pyodide:
    uses: $/.github/workflows/pyodide.yml
    permissions:
      contents: read

  build:
    needs: [prerequisites, pyodide]
    strategy:
      matrix:
        os: [ubuntu-slim]
        python-version: ["3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Builds without any write permissions; the publish job only receives the artifact.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
        with:
          version: 1.18.2

      - name: Build package
        run: hatch build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Only hands the distributions to the publish job.
          retention-days: 1

  publish:
    needs: [build]
    # The PyPI publish action runs in a Docker container, which ubuntu-slim cannot run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Write permissions are needed to create OIDC tokens.
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # We rely on a trusted publisher configuration being present on PyPI,
      # see https://docs.pypi.org/trusted-publishers/.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [publish]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.gh-release.outputs.prerelease }}
    permissions:
      # Write permissions are needed to make GitHub releases.
      contents: write

    steps:
      - name: GH release
        id: gh-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # PEP 440 pre-releases (a, b, rc, dev) are flagged as such; final and post releases are not.
          case "$TAG" in
            *post*) prerelease=false ;;
            *[a-z]*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --verify-tag --title "$TAG" --prerelease="$prerelease" --generate-notes \
            --notes "Please see https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md for the full release notes."

  documentation:
    needs: [github-release]
    permissions:
      contents: write
    uses: $/.github/workflows/docs.yml
    with:
      version: ${{ github.ref_name }}
      # Pre-releases get their own docs version but must not move the stable alias.
      alias: ${{ needs.github-release.outputs.prerelease != 'true' && 'stable' || '' }}
