name: Export OTel

on:
  # The job checks out no code, runs a single pinned action with minimal permissions,
  # and only handles runs from this repository.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - "CI"
      - "CD"
      - "Cron Test"
      - "Auto-Merge Dependabot PR"
    types: [completed]

permissions: {}

jobs:
  otel-trace:
    if: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    steps:
      - name: Export workflow run's traces
        uses: dash0hq/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          otlpEndpoint: ${{ vars.HONEYCOMB_OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.HONEYCOMB_OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          runId: ${{ github.event.workflow_run.id }}
