repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.6.0
    hooks:
      - id: pydoclint
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.31.1
    hooks:

      - id: check-github-workflows

      - id: check-readthedocs
  # Optional: checks the code health of staged changes when the CodeScene CLI is
  # installed and signed in, and does nothing otherwise.
  - repo: local
    hooks:
      - id: codescene-delta
        name: CodeScene code health
        entry: sh -c 'command -v cs >/dev/null 2>&1 || exit 0; exec cs delta --git-hook --staged'
        language: system
        pass_filenames: false
